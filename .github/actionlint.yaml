# actionlint 1.7.12 bundles outdated metadata for actions/create-github-app-token@v3,
# which now takes `client-id` and deprecates `app-id`.
# See https://github.com/rhysd/actionlint/issues/648
paths:
  .github/workflows/check-for-visual-regressions.yaml:
    ignore:
      - 'missing input "app-id" which is required by action "actions/create-github-app-token@v3"'
      - 'input "client-id" is not defined in action "actions/create-github-app-token@v3"'
