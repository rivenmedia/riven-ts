name: Visual regression

# Captures a screenshot of every Storybook story and uploads them as an artifact.
# Artifacts from runs on `main` provide the baseline, and the "Report visual regression results" workflow compares
# pull requests against them. It runs separately so that pull requests from forks and Dependabot can be commented on.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: "visual-regression-${{ github.event.pull_request.number || github.sha }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_RUN_SUMMARY: 1
  DO_NOT_TRACK: true # Disable Turborepo telemetry - https://turborepo.dev/docs/telemetry

permissions:
  contents: read

jobs:
  visual-regression:
    name: Visual regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up project environment
        uses: ./.github/actions/set-up-project-environment

      - name: Pre-verification steps
        uses: ./.github/actions/pre-verify
        with:
          task: test:visual

      # Story failures are reported by the component tests, so capture as many screenshots as possible
      - name: Capture screenshots
        run: pnpm turbo @repo/frontend#test:visual
        continue-on-error: true
        env:
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

      # reg-actions expects baseline screenshots to be in the `1_actual` directory of the artifact
      - name: Prepare screenshots
        run: |
          mkdir -p screenshots
          cp -r apps/frontend/__screenshots__ screenshots/1_actual

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: error

      # `workflow_run` events do not include the pull request number for pull requests from forks
      - name: Save pull request number
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p pull-request
          echo "$PR_NUMBER" > pull-request/number
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Upload pull request number
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pull-request
          path: pull-request
          retention-days: 1
          if-no-files-found: error

      - uses: charpeni/turborepo-summary-action@v1
        if: always()
