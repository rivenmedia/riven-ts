name: Verify

description: |
  This workflow runs various verification tasks (linting, type checking, tests, etc.) on pull requests.

  It also tests that the Docker images are buildable, optionally pushing to the container registry if the "build-docker" label is present.

run-name: "Verify: ${{ github.event.pull_request.title }} (#${{
  github.event.pull_request.number }})"

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  group: "verify-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  verify:
    name: Verify - ${{ matrix.task.name }}
    permissions:
      contents: read
      pull-requests: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        task:
          - name: Linting
            command: lint
            runner-requirements:
              - fuse
          - name: Formatting
            command: //#format:check:ci

          # Separate test jobs per-platform ensures that the project can build natively
          - name: Tests (linux-x64)
            command: test
            concurrency: "100%"
            runner-requirements: &test-runner-requirements
              - redis-server
              - fuse
            runner: ubuntu-latest
          - name: Tests (linux-arm64)
            command: test
            concurrency: "100%"
            runner-requirements: *test-runner-requirements
            runner: ubuntu-24.04-arm
          - name: Tests (macos-arm64)
            command: test
            concurrency: "100%"
            runner-requirements: *test-runner-requirements
            runner: macos-latest
          - name: Tests (macos-intel)
            command: test
            concurrency: "100%"
            runner-requirements: *test-runner-requirements
            runner: macos-15-intel
          - name: Check for missing migrations
            command: migration:check
            runner-requirements:
              - postgres-service
            env:
              RIVEN_SETTING__databaseUrl: postgres+psycopg2://runner:runner@127.0.0.1:5432/riven
          - name: Knip (development)
            command: //#knip:ci:development
          - name: Knip (production)
            command: //#knip:ci:production
          - name: Build Wiki
            command: "@repo/wiki#build"
            runner-requirements:
              - fuse
          - name: Validate generators
            command: //#validate-generators
            runner-requirements:
              - redis-server
    uses: ./.github/workflows/run-turbo-task.yaml
    with:
      runner: ${{ matrix.task.runner || 'ubuntu-latest' }}
      task: ${{ matrix.task.command }}
      concurrency: ${{ matrix.task.concurrency || '10' }}
      runner-requirements: ${{ matrix.task.runner-requirements &&
        toJson(matrix.task.runner-requirements) || '[]' }}
      env: ${{ matrix.task.env && toJson(matrix.task.env) || '{}' }}
    secrets: inherit
