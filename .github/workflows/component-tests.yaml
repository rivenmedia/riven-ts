name: Component Tests

description: |
  This workflow runs component tests on pull requests.

run-name: "Component Tests: ${{ github.event.pull_request.title }} (#${{
  github.event.pull_request.number }})"

permissions: {}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      # Starts or cancels the baseline update, which only runs once a PR is ready for review
      - ready_for_review
      - converted_to_draft

concurrency:
  group: "component-tests-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  component-tests:
    name: Component tests (${{ matrix.os }})
    permissions:
      contents: write
      pull-requests: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    uses: ./.github/workflows/run-turbo-task.yaml
    with:
      runner: ${{ matrix.os }}
      task: test:component
      concurrency: 100%
    secrets: inherit

  check-for-visual-regressions:
    name: Check for visual regressions
    needs: component-tests
    # Visual regressions fail the component tests, so this runs regardless of their result
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: read
    uses: ./.github/workflows/check-for-visual-regressions.yaml
    secrets: inherit
    with:
      run-id: ${{ github.run_id }}
      pr-number: ${{ github.event.pull_request.number }}
      head-repository: ${{ github.event.pull_request.head.repo.full_name }}
      head-branch: ${{ github.head_ref }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      draft: ${{ github.event.pull_request.draft }}

  visual-regressions:
    name: Visual regressions
    needs: check-for-visual-regressions
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check baselines are up to date
        env:
          REQUIRES_UPDATE: ${{ needs.check-for-visual-regressions.outputs.requires-update }}
        run: |
          case "$REQUIRES_UPDATE" in
            false) echo "The baselines match the component test results and were committed by the update-visual-regression-baselines deployment" ;;
            true) echo "::error::The baselines do not match the component test results, or were changed outside of the update-visual-regression-baselines deployment"; exit 1 ;;
            *) echo "::error::The baselines could not be checked"; exit 1 ;;
          esac
