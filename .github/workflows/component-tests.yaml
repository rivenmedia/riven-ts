name: Component Tests

description: |
  This workflow runs component tests on pull requests.

run-name: "Component Tests: ${{ github.event.pull_request.title }} (#${{
  github.event.pull_request.number }})"

permissions: {}

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths-ignore:
      - "**/__vis__/**/__baselines__/**"

concurrency:
  group: "component-tests-${{ github.event.pull_request.number }}"
  cancel-in-progress: true

jobs:
  component-tests:
    name: Component tests (${{ matrix.os }})
    permissions:
      contents: write
      pull-requests: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    uses: ./.github/workflows/run-turbo-task.yaml
    with:
      runner: ${{ matrix.os }}
      task: test:component
      concurrency: 100%
    secrets: inherit

  # Fork PRs cannot comment or access secrets, instead they are
  # checked by the "Inspect Visual Regression report from fork" workflow
  check-for-visual-regressions:
    name: Check for visual regressions
    needs: component-tests
    # Visual regressions fail the component tests, so this runs regardless of their result
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    uses: ./.github/workflows/check-for-visual-regressions.yaml
    with:
      run-id: ${{ github.run_id }}
      pr-number: ${{ github.event.pull_request.number }}
      head-repository: ${{ github.event.pull_request.head.repo.full_name }}
      head-branch: ${{ github.head_ref }}
      head-sha: ${{ github.event.pull_request.head.sha }}
