name: Post verify

description: Runs post-verification steps after a task is completed

inputs:
  task:
    description: The task that was run
    required: true
  success:
    description: Whether the task was successful
    required: true

runs:
  using: composite
  steps:
    - name: Merge coverage reports
      if: ${{ inputs.task == 'test' && inputs.success == 'true' }}
      uses: ./.github/actions/generate-coverage-report

    - name: Upload Knip report
      if: ${{ inputs.task == '//#knip:ci:production' }}
      uses: actions/upload-artifact@v7
      with:
        name: knip-report
        path: knip-report.json
        retention-days: 1
        if-no-files-found: error

    - name: Generate visual report
      id: visual-report
      if: ${{ inputs.task == 'test:component' }}
      shell: bash
      working-directory: apps/frontend
      run: node scripts/vis-report.ts generate --root __vis__/docker --head-sha "$HEAD_SHA" --pr-number "$PR_NUMBER"
      env:
        # `github.sha` is the merge commit for pull requests, but approvals are made against the head commit
        HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        PR_NUMBER: ${{ github.event.pull_request.number }}

    # Consumed by the "Report visual results" and "Approve visual changes" workflows
    - name: Upload visual results
      if: ${{ steps.visual-report.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        name: vis-results
        path: |
          apps/frontend/.vis-report/manifest.json
          apps/frontend/.vis-report/images/
        retention-days: 14
        if-no-files-found: error

    # Unzipped, so GitHub serves the report directly in the browser
    - name: Upload visual report
      if: ${{ steps.visual-report.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        path: apps/frontend/.vis-report/visual-report.html
        archive: false
        retention-days: 14
        if-no-files-found: error
