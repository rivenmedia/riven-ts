name: Post verify

description: Runs post-verification steps after a task is completed

inputs:
  task:
    description: The task that was run
    required: true
  success:
    description: Whether the task was successful
    required: true

runs:
  using: composite
  steps:
    - name: Merge coverage reports
      if: ${{ inputs.task == 'test' && inputs.success == 'true' }}
      uses: ./.github/actions/generate-coverage-report

    - name: Upload Knip report
      if: ${{ inputs.task == '//#knip:ci:production' }}
      uses: actions/upload-artifact@v7
      with:
        name: knip-report
        path: knip-report.json
        retention-days: 1
        if-no-files-found: error

    - name: Compare screenshots
      if: ${{ inputs.task == 'test:component' }}
      uses: reg-viz/reg-actions@v3
      with:
        github-token: ${{ github.token }}
        image-directory-path: apps/frontend/__screenshots__
        artifact-name: screenshots
        threshold-pixel: 50
        outdated-comment-action: update
        matching-threshold: 0.1 # Ignores minor rendering noise from blurs, gradients and image decoding
