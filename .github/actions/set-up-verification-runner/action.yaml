name: Set up verification runner

description: |
  Sets up the runner for a verification job.

  Depending on the task being ran, it may need additional services to be installed.

  For example, integration tests require `redis-server` and `fuse`.

inputs:
  install-fuse:
    description: Whether to install FUSE (required for integration tests)
    required: false
    default: "false"
  install-redis-server:
    description: Whether to install redis-server (required for integration tests)
    required: false
    default: "false"
  set-up-postgres-service:
    description: Whether to set up the postgres service (required for migration check)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Download redis-server
      if: ${{ inputs.install-redis-server == 'true' }}
      uses: shogo82148/actions-setup-redis@v1
      with:
        redis-version: "8"
        auto-start: "false"

    - name: Install FUSE
      shell: bash
      if: ${{ inputs.install-fuse == 'true' }}
      run: |
        if [ "${{ runner.os }}" == "macOS" ]; then
          brew install --cask macfuse
        else
          sudo apt-get update
          sudo apt-get install -y fuse libfuse-dev
          # Riven mounts with allowOther, which FUSE only permits when this is set
          grep -qx user_allow_other /etc/fuse.conf || echo user_allow_other | sudo tee -a /etc/fuse.conf
        fi

    - name: Set up Postgres service
      shell: bash
      if: ${{ inputs.set-up-postgres-service == 'true' }}
      run: |
        if [ "${{ runner.os }}" == "macOS" ]; then
          # Homebrew's Postgres is keg-only, and its superuser is the current user (runner)
          formula="$(brew list --formula | grep -m1 -E '^postgresql(@[0-9]+)?$' || true)"
          if [ -z "$formula" ]; then
            formula="postgresql@17"
            brew install "$formula"
          fi
          bin="$(brew --prefix "$formula")/bin"
          echo "$bin" >> "$GITHUB_PATH"
          brew services start "$formula"

          until "$bin/pg_isready" -h 127.0.0.1; do sleep 1; done
          "$bin/psql" -h 127.0.0.1 -d postgres -c "ALTER ROLE runner WITH PASSWORD 'runner';"
        else
          sudo service postgresql start

          until pg_isready; do sleep 1; done
          sudo -u postgres createuser -s -d -r -w runner
          sudo -u postgres psql -c "ALTER ROLE runner WITH PASSWORD 'runner';"
        fi
